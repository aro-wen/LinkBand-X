services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: linkband
      POSTGRES_PASSWORD: linkband
      POSTGRES_DB: linkband
    ports: ["5432:5432"]

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]

  dashboard:
    build:
      context: .
      dockerfile: infra/Dockerfile.dashboard
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
